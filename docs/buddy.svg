<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-label="Buddy, a soft white dumpling-shaped blob, wobbling and blinking">
  <title>Buddy</title>
  <!-- cream card so Buddy reads the same on GitHub's light and dark themes -->
  <rect x="4" y="4" width="312" height="232" rx="28" fill="#F2EAE0" stroke="#2A2238" stroke-width="3"/>

  <!-- the floor shadow breathes with the bob -->
  <ellipse cx="160" cy="186" rx="62" ry="8" fill="#9B8EC7" opacity="0.45">
    <animate attributeName="rx" dur="3.2s" repeatCount="indefinite" values="62;46;62" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.45;0.25;0.45" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
  </ellipse>

  <g>
    <!-- gentle float -->
    <animateTransform attributeName="transform" type="translate" dur="3.2s" repeatCount="indefinite" values="80 46;80 32;80 46" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <g>
      <!-- the body: an amoeba-like wobble between three outlines -->
      <path fill="#FFFFFF" stroke="#2A2238" stroke-width="3" stroke-linejoin="round" d="M80 14 C121 12 149 32 151 62 C153 91 131 108 82 108 C35 108 9 95 9 64 C9 32 39 16 80 14 Z">
        <animate attributeName="d" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.33;0.66;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
          values="M80 14 C121 12 149 32 151 62 C153 91 131 108 82 108 C35 108 9 95 9 64 C9 32 39 16 80 14 Z;
                  M78 10 C124 12 152 36 150 64 C148 94 126 110 80 110 C38 110 12 92 11 62 C10 30 36 8 78 10 Z;
                  M82 15 C118 10 147 28 152 60 C156 90 134 112 84 107 C33 106 6 98 8 66 C10 34 42 19 82 15 Z;
                  M80 14 C121 12 149 32 151 62 C153 91 131 108 82 108 C35 108 9 95 9 64 C9 32 39 16 80 14 Z"/>
      </path>
      <!-- second pen line, like the sketch -->
      <path fill="none" stroke="#2A2238" stroke-width="1.4" stroke-opacity="0.55" d="M82 11 C123 13 147 34 149 60 C151 92 128 110 80 106 C37 106 11 93 12 62 C13 33 41 13 82 11 Z">
        <animate attributeName="d" dur="4.2s" repeatCount="indefinite"
          values="M82 11 C123 13 147 34 149 60 C151 92 128 110 80 106 C37 106 11 93 12 62 C13 33 41 13 82 11 Z;
                  M80 13 C120 9 151 31 151 63 C151 95 130 108 79 108 C36 109 10 96 10 63 C10 30 40 15 80 13 Z;
                  M82 11 C123 13 147 34 149 60 C151 92 128 110 80 106 C37 106 11 93 12 62 C13 33 41 13 82 11 Z"/>
      </path>

      <!-- eyes blink every few seconds -->
      <ellipse cx="60" cy="58" rx="7" ry="7" fill="#2A2238">
        <animate attributeName="ry" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" values="7;7;0.6;7;7"/>
      </ellipse>
      <ellipse cx="102" cy="56" rx="7" ry="7" fill="#2A2238">
        <animate attributeName="ry" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.9;0.93;0.96;1" values="7;7;0.6;7;7"/>
      </ellipse>
      <circle cx="62.5" cy="55" r="2" fill="#FFFFFF">
        <animate attributeName="opacity" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.9;0.91;0.96;1" values="1;1;0;1;1"/>
      </circle>
      <circle cx="104.5" cy="53" r="2" fill="#FFFFFF">
        <animate attributeName="opacity" dur="4.6s" repeatCount="indefinite" keyTimes="0;0.9;0.91;0.96;1" values="1;1;0;1;1"/>
      </circle>
      <path d="M74 74 Q81 80 88 73" fill="none" stroke="#2A2238" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
