<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf6ec;
    font-family: sans-serif;
  }

  .buddy-wrapper {
    animation: float 3.5s ease-in-out infinite;
  }

  .buddy-shadow {
    animation: shadow-pulse 3.5s ease-in-out infinite;
  }

  /* Eyes blink: open most of the time, quick blink near the end of cycle */
  .eye {
    animation: blink 4s ease-in-out infinite;
    transform-origin: center;
  }
  .eye-right {
    animation-delay: 0.05s; /* slight asymmetry */
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    45%      { transform: translateY(-14px) scale(1.02, 0.98); } /* slight stretch at top */
    50%      { transform: translateY(-16px) scale(1.02, 0.98); }
    100%     { transform: translateY(0) scale(1, 1.03); } /* slight squash on landing */
  }

  @keyframes shadow-pulse {
    0%, 100% { opacity: 0.25; transform: translateX(-50%) scaleX(1); }
    50%      { opacity: 0.12; transform: translateX(-50%) scaleX(0.8); }
  }

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    93%, 97%      { transform: scaleY(0.1); }
  }
</style>
</head>
<body>

<div style="position: relative;">
  <div class="buddy-wrapper">
    <svg width="220" height="240" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
      <!-- Body: rounded blob, flat-ish bottom like #11 -->
      <path d="M30 90
               C 30 30, 80 10, 110 10
               C 140 10, 190 30, 190 90
               L 190 190
               C 190 215, 170 225, 150 222
               C 130 226, 90 226, 70 222
               C 50 225, 30 215, 30 190
               Z"
            fill="#FFF8EE" stroke="#3A3A3A" stroke-width="3"/>

      <!-- Left ear/arm nub -->
      <path d="M40 130 C 20 135, 18 155, 35 165 C 45 168, 55 160, 50 145 Z"
            fill="#FFF8EE" stroke="#3A3A3A" stroke-width="3"/>

      <!-- Right ear/arm nub -->
      <path d="M180 130 C 200 135, 202 155, 185 165 C 175 168, 165 160, 170 145 Z"
            fill="#FFF8EE" stroke="#3A3A3A" stroke-width="3"/>

      <!-- Eyes -->
      <ellipse class="eye eye-left" cx="85" cy="95" rx="9" ry="11" fill="#3A3A3A"/>
      <ellipse class="eye eye-right" cx="135" cy="95" rx="9" ry="11" fill="#3A3A3A"/>

      <!-- Smile -->
      <path d="M95 120 Q 110 132, 125 120" stroke="#3A3A3A" stroke-width="3"
            fill="none" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Shadow -->
  <div class="buddy-shadow" style="
    position: absolute;
    bottom: -10px;
    left: 50%;
    width: 120px;
    height: 18px;
    background: #3A3A3A;
    border-radius: 50%;
    filter: blur(4px);
    z-index: -1;
  "></div>
</div>

</body>
</html>
